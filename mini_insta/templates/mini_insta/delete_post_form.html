{% extends 'mini_insta/show_post.html' %}
{% load static %}
{% block content %}

<!-- scriptlet code to display the value of the variable `articles` 
{{ articles }}
-->
<h1>Profile: {{profile.display_name}}</h1>
<div>
    <p>{{profile.username}}</p> <p>{{profile.join_date}}</p>
</div>
<hr>
<div>
    <h3>Are you sure you want to delete this post?</h3>
    
    <p>
    {{post.caption}}
    </p>
    
    
    <form method='POST'>
        {% csrf_token %}
        <input type='submit' value="Delete">
    </form>
    <form method='GET' action="{% url 'profile' profile %}">
        {% csrf_token %}
        <input type='submit' value="Cancel">
    </form>
</div>
{% endblock %}
